<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Docs Squared</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: #111827;
      background: #fff;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 2px;
      margin-bottom: 4px;
    }
    .brand-d { font-size: 20px; font-weight: 800; color: #111827; }
    .brand-2 { font-size: 14px; font-weight: 800; color: #4A90D2; position: relative; top: -6px; }
    .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 16px; line-height: 1.4; }

    .status-card {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .status-card.connected { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .status-card.disconnected { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
    .status-card.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .status-card.loading { background: #f9fafb; border: 1px solid #e5e7eb; color: #6b7280; text-align: center; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #16a34a; }
    .dot.amber { background: #f59e0b; }
    .dot.red { background: #dc2626; }

    button {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background .15s;
    }
    .btn-primary { background: #4A90D2; color: #fff; }
    .btn-primary:hover { background: #3a7eb9; }
    .btn-secondary { background: #fff; color: #4A90D2; border: 1px solid #d1d5db; margin-top: 8px; }
    .btn-secondary:hover { background: #f9fafb; }

    .help {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.5;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f3f4f6;
    }
    .help a { color: #4A90D2; text-decoration: none; }
    .help a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="brand">
    <span class="brand-d">docs</span><span class="brand-2">2</span>
  </div>
  <p class="subtitle">
    Highlight text on any webpage, right-click, and choose
    <strong>Humanize</strong> or <strong>Check for AI</strong>.
  </p>

  <div id="status" class="status-card loading">
    <div class="status-row">
      <span>Checking connection...</span>
    </div>
  </div>

  <button id="signin" class="btn-primary" style="display:none">
    Sign in to Docs²
  </button>
  <button id="recheck" class="btn-secondary" style="display:none">
    Re-check connection
  </button>

  <div class="help">
    The extension uses your existing docsquared.app login.
    Each use costs 1 credit from your monthly allotment.
  </div>

  <script src="popup.js"></script>
</body>
</html>
