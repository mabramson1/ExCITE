<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Docs Squared</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: #111827;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
      color: #4A90D2;
    }
    .subtitle {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4A90D2;
      box-shadow: 0 0 0 2px rgba(74, 144, 210, 0.2);
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: #4A90D2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #3a7eb9; }
    button.secondary {
      background: white;
      color: #4A90D2;
      border: 1px solid #d1d5db;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .status.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .help {
      font-size: 11px;
      color: #6b7280;
      margin-top: 12px;
      line-height: 1.5;
    }
    .help a { color: #4A90D2; text-decoration: none; }
    .help a:hover { text-decoration: underline; }
    code {
      background: #f3f4f6;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>Docs²</h1>
  <p class="subtitle">Highlight any text on any webpage. Right-click to humanize or check for AI.</p>

  <label for="apikey">API Key</label>
  <input type="password" id="apikey" placeholder="dsq_..." autocomplete="off">

  <button id="save">Save Key</button>
  <button id="clear" class="secondary">Clear</button>

  <div id="status"></div>

  <div class="help">
    Get a key in <a href="https://docsquared.app/settings" target="_blank">your settings page</a>.
    Right-click any selected text and pick "Humanize" or "Check for AI".
  </div>

  <script src="popup.js"></script>
</body>
</html>
